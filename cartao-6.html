<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anna Sex Shop - Cartão Digital</title>

<style>
/* Reset básico para mobile */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

/* CONTAINER PRINCIPAL OTIMIZADO PARA 9:16 */
.banner {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: auto;
}

/* IMAGEM DE FUNDO */
.banner img {
    width: 100%;
    height: auto;
    display: block;
}

/* ÁREAS CLICÁVEIS */
.btn {
    position: absolute;
    left: 10%;
    width: 80%;
    height: 7%;
    border-radius: 50px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0); /* Totalmente invisível */
    transition: 0.3s;
    overflow: hidden;
}

/* Efeito de brilho */
.btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shine 3s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

/* POSICIONAMENTO STORIES */
.btn-whatsapp { top: 62%; }
.btn-maps { top: 71%; }
.btn-site { top: 80%; }

.btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.03);
}

/* BOTÃO FLUTUANTE */
.whatsapp-float {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #25D366;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 35px;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 1000;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
    70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
}
</style>
</head>

<body>

<div class="banner">
    <img src="banner.jpg" alt="Anna Sex Shop">

    <a class="btn btn-whatsapp" href="https://wa.me/5516991196897?text=Olá!%20Gostaria%20de%20mais%20informações" target="_blank"></a>

    <a class="btn btn-maps" href="https://maps.app.goo.gl/sua-localizacao-aqui" target="_blank"></a>

    <a class="btn btn-site" href="https://www.anna.com.br" target="_blank"></a>
</div>

<a class="whatsapp-float" href="https://wa.me/5516991196897?text=Olá!%20Gostaria%20de%20mais%20informações" target="_blank">
    <span style="margin-top: -5px;">💬</span>
</a>

</body>
</html>
